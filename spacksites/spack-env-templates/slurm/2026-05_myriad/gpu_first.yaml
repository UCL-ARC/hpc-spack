spack:
  concretizer:
    unify: when_possible
  view: false

  packages:

    fftw-api:
      require: 'fftw'

  specs:
  # CUDA packages, compile them with gcc@12
  - matrix:
    - - 'cuda@12.6.2' # v12.6.2 is latest available in Spack v0.23
      - namd@3.0.2 +cuda +single_node_gpu cuda_arch=70,80,90 ^charmpp backend=multicore
      # kokkos will require only one cuda_arch as different bit sizes for some types betw 60, 70 and 80 - can use the lowest
      - gromacs@2024.3 -mpi +cuda cuda_arch=70,80,90
      - gromacs@2023.5 +cuda cuda_arch=70,80,90 +plumed ^openmpi@5.0.10 +cuda
      - openmpi@5.0.10 +cuda fabrics=cma schedulers=slurm +legacylaunchers
    - - '%gcc@12.3.0'
  # nvhpc packages
  #- 'vasp@6.4.3 %nvhpc +cuda cuda_arch=70,80 +hdf5'
