spack:
  concretizer:
    unify: when_possible
  view: false

  specs:
  # depend on gpu-on-gpu packages
  - matrix:
    - - 'cp2k@2024.2 +cuda +mpi +openmp ~sirius cuda_arch=80 build_system=cmake ^dbcsr@2.6.0 cuda_arch=80 ^libxsmm@1.17 ^openmpi@4.1.6 +cuda cuda_arch=70,80'
    - - '%gcc@12.3.0'

  include_concrete:
  - /apps/spack/0.23/deploy/2026-05/spack/var/spack/environments/gpu_first
  - /apps/spack/0.23/deploy/2026-05/spack/var/spack/environments/gpu-on-gpu
