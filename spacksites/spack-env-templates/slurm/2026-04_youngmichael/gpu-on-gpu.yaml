spack:
  packages:
    all:
      require:
      - 'target=x86_64_v3'
  specs:
  # CUDA packages, compile them with gcc@12
  - matrix:
    # Fix `openblas` as blas provider, to avoid picking other unusual implementations
    - - 'dbcsr@2.6 +openmp +mpi +cuda cuda_arch=80 -examples ^openblas@0.3.28 threads=openmp ^openmpi@4.1.6 +cuda cuda_arch=80' # only one CUDA arch allowed
      - 'dbcsr@2.8 +openmp +mpi +cuda cuda_arch=80 -examples ^openblas@0.3.28 threads=openmp ^openmpi@4.1.6 +cuda cuda_arch=80' # only one CUDA arch allowed
      - 'py-alphafold@2.2.4 +cuda cuda_arch=80 ^py-scipy@1.11.4 ^py-pythran@0.12.2 ^openmm@7.5.1 +cuda cuda_arch=80 ^openblas ^llvm -gold ^openmpi@4.1.6 +cuda'
      - 'plumed@2.9.2 +pytorch ^py-torch@2.5.1 ^cuda@12.4 ^openmpi@4.1.6 +cuda cuda_arch=80'
      - 'octopus@16.4 +mpi +cuda cuda_arch=80 ^openmpi@4.1.6 +cuda cuda_arch=80'
    - - '%gcc@12.3.0'

  concretizer:
    unify: when_possible
  view: false

  include_concrete:
  - /apps/spack/0.23/deploy/2026-04/spack/var/spack/environments/gpu_base
  - /apps/spack/0.23/deploy/2026-04/spack/var/spack/environments/gpu_first
