spack:
  concretizer:
    unify: when_possible
  view: false

  packages:
    fftw-api:
      require: 'fftw'

    all:
      require:
      - 'target=x86_64_v3'

  specs:
  - matrix:
    - - cuda@12.6.2
      - cuda@12.9.1
      - cuda@13.3.0
      - openmpi@4.1.6 +cuda cuda_arch=80 fabrics=psm2,ofi schedulers=slurm +legacylaunchers ^cuda@12.6.2
      - nvhpc@26.3 default_cuda=12.6.2 +mpi
    - - '%gcc@12.3.0'

  include_concrete:
  - /apps/spack/0.23/deploy/2026-04/spack/var/spack/environments/avx2_buildtools
