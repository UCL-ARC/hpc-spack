spack:
  packages:
    all:
      require:
      - 'target=x86_64_v3'

  specs:
  # nvhpc packages
  - matrix:
    - - 'vasp@6.4.3 +cuda cuda_arch=80 +hdf5 ^hdf5%gcc ^nccl%gcc cuda_arch=80 ^cuda@12.9.1 ^openmpi@4.1.6 +cuda cuda_arch=80'
      - 'vasp@6.5.1 +cuda cuda_arch=80 +hdf5 ^hdf5%gcc ^nccl%gcc cuda_arch=80 ^cuda@12.9.1 ^openmpi@4.1.6 +cuda cuda_arch=80'
      - 'vasp@6.6.1 +cuda cuda_arch=80 +hdf5 ^hdf5%gcc ^nccl%gcc cuda_arch=80 ^cuda@12.9.1 ^openmpi@4.1.6 +cuda cuda_arch=80'
    - - '%nvhpc'

  concretizer:
    unify: when_possible
  view: false

  include_concrete:
  - /apps/spack/0.23/deploy/2026-04/spack/var/spack/environments/gpu_base
