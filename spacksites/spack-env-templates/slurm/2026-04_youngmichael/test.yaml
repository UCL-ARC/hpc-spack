spack:
  concretizer:
    unify: when_possible
  view: false

  packages:
    mpi:
      require: 'openmpi'
    openmpi:
      require: 'arch=linux-rhel9-x86_64_v3'
    fftw-api:
      require: 'fftw'

    all:
      require:
      - 'target=x86_64_v3'

  # the Michael avx2 end applications and Young GPU applications
  specs:
  # Packages built with GCC
  - matrix:
    - - plumed@2.9.2 +pytorch
    - - '%gcc@12.3.0'

  include_concrete:
  - /apps/spack/0.23/deploy/2026-04/spack/var/spack/environments/avx2_buildtools
