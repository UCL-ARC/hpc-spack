spack:
  concretizer:
    unify: when_possible
  view: false

  packages:
    mpi:
      require: 'openmpi'
    openmpi:
      require: 'arch=linux-rhel9-x86_64_v3'
    fftw-api:
      require: 'fftw'

    all:
      require:
      - 'target=x86_64_v3'

  # the Michael avx2 end applications and Young GPU applications
  specs:
  # Packages built with GCC
  - matrix:
    - - bcftools@1.16
      - beast2@2.7.4
      - bedtools2@2.31.0
      - bwa@0.7.17
      - castep@26.11 +mpi +libxc ^openblas threads=none ^openmpi -cuda
      - castep@25.12 +mpi +libxc ^openblas threads=none ^openmpi -cuda
      - castep@24.1 +mpi +libxc ^openblas threads=none ^openmpi -cuda
      - castep@23.1 +mpi +libxc ^openblas threads=none ^openmpi -cuda
      - cp2k@2024.3 +mpi -cuda ^openblas threads=openmp ^openmpi -cuda
      - cp2k@2025.2 +mpi ^openmpi -cuda
      - gatk@4.4.0.0
      - glpk@5.0 +gmp
      - grace@5.1.25
      - gromacs@2024.3 -double ^openmpi -cuda
      - gromacs@2023.5 -double +plumed ^openmpi -cuda
      - gsl@2.8
      - hdf5 +cxx +fortran -mpi +hl
      - hdf5 +fortran +mpi +hl ^openmpi -cuda
      - htslib@1.17
      - lammps@20240829.1 +mpi +python +amoeba +asphere +bocs +body +bpm +brownian +cg-dna +cg-spica +class2 +colloid +colvars +compress +coreshell +dielectric +diffraction +dipole +dpd-basic +dpd-meso +dpd-react +dpd-smooth +drude +eff +electrode +extra-compute +extra-dump +extra-fix +extra-molecule +extra-pair +fep +granular +interlayer +kspace +lepton +machdyn +manybody +mc +meam +mesont +misc +ml-iap +ml-pod +ml-snap +ml-uf3 +mofff +molecule +openmp +opt +orient +peri +phonon +plugin +poems +qeq +reaction +reaxff +replica +rigid +rheo +shock +sph +spin +srd +tally +uef +voronoi +yaff ^openmpi -cuda
      - libnsl
      - libxc@6.2.2
      - libxcursor
      - namd@3.0.2 ^charmpp backend=mpi ^fftw -mpi
      - netcdf-c@4.9.2 -mpi
      - netcdf-fortran@4.6.1
      - netlib-scalapack@2.2.0 ^openblas threads=none ^openmpi -cuda
      - netlib-scalapack@2.2.0 ^openblas threads=openmp ^openmpi -cuda
      - nwchem@7.2.3
      - numactl@2.0.18
      - octopus@16.4 +mpi ^openmpi@4.1.6
      - openbabel@3.1.1 +openmp
      - openfoam@2512 +int64
      - openfoam@2312 +int64
      - openfoam@2112 +int64
      - orca@avx2-6.0.1
      - parallel@20240822
      - paraview@5.13.1 +python ^[virtuals=gl] osmesa ^llvm
      - picard@2.26.2
      - plumed@2.9.2
      - quantum-espresso@7.4 cflags='-O2' fflags='-O2' ^openmpi -cuda # ICE in gcc 12 and 13 vectorisation: https://gcc.gnu.org/bugzilla/show_bug.cgi?id=112404
      - samtools@1.17
      - vmd@2.0.0a8
      - xcb-util
      - xcb-util-cursor
    - - '%gcc@12.3.0'

  include_concrete:
  - /apps/spack/0.23/deploy/2026-04/spack/var/spack/environments/avx2_buildtools
  - /apps/spack/0.23/deploy/2026-04/spack/var/spack/environments/multiarch
