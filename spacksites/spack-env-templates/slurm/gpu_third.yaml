spack:

  specs:
  # depend on gpu-on-gpu packages
  - matrix:
    - - 'cp2k@2024.2 +cuda +mpi +openmp ~sirius cuda_arch=60,70,80 build_system=cmake ^dbcsr@2.6.0 cuda_arch=60 ^libxsmm@1.17'
    - - '%gcc@12.3.0'
  concretizer:
    unify: when_possible
  view: false
  include_concrete:
  - /lustre/apps/spack/0.23/deploy/2025-07/spack/var/spack/environments/base
  - /lustre/apps/spack/0.23/deploy/2025-07/spack/var/spack/environments/gpu_first
  - /lustre/apps/spack/0.23/deploy/2025-07/spack/var/spack/environments/gpu-on-gpu
