spack:
  packages:
    all:
      require:
      - 'target=x86_64_v3'

  specs:
  - matrix:
    - - nvhpc +mpi default_cuda=12.6
    - - '%gcc@12.3.0'

  concretizer:
    unify: when_possible
  view: false
  include_concrete:
  - /apps/spack/0.23/deploy/2026-04/spack/var/spack/environments/avx2_buildtools

