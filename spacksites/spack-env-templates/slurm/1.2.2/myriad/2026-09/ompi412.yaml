spack:
  concretizer:
    unify: when_possible
  view: false

  packages:
    all:
      require:
      - 'target=x86_64_v4'

  specs:
  - matrix:
    - - openmpi@4.1.2 fabrics=ucx,cma schedulers=slurm +legacylaunchers
      - orca@5.0.4
    - - '%gcc@14.2.0'

  include_concrete:
  - /apps/spack/1.2.2/deploy/2026-09/spack/var/spack/environments/base
