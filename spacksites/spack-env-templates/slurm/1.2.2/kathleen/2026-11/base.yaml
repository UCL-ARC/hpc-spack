spack:

  packages:
    quantum-espresso:
      package_attributes:
        parallel: false

  specs:
  - beast2@2.7.7
  - gatk@4.5.0.0
  - picard@3.3.0
  - matrix:
    - - apr@1.7.5
      - apr-util@1.6.3
      - bcftools@1.23.1
      - bedtools2@2.31.1
      - bwa@0.7.19
      - cmake@3.31.11
      - curl@8.20.0 +libidn2
      - fftw@3.3.11 -mpi -openmp
      - gsl@2.8
      - gzip@1.14
      - hdf5@1.14.6 +cxx +fortran -mpi +hl
      - hdf5@1.14.6 +fortran +mpi +hl
      - htslib@1.23.1
      - openmpi@4.1.6 fabrics=psm2,ofi schedulers=slurm +legacylaunchers
      - python@3.14.5
      - netcdf-c@4.10.0 -mpi
      - netcdf-fortran@4.6.2
      - samtools@1.23.1
      - subversion@1.14.5
      # stop it picking an openblas with threads=openmp purely for package reuse
      - castep@26.11 +libxc ^openblas threads=none
      - castep@24.1 +libxc ^openblas threads=none
      - castep@23.1 +libxc ^openblas threads=none
      - cp2k@2024.3 
      - gromacs@2024.3 -double
      #- gromacs@2024.3 +double
      # If we want gromacs 2023.5 we'll need to do our own recipe, it isn't included any longer
      #- gromacs@2023.5 -double +plumed
      #- gromacs@2023.5 +double +plumed
      - libxc@7.0.0
      #- namd@2.14 ^charmpp backend=ucx pmi=pmix ^fftw -mpi
      #- namd@3.0.1 ^charmpp backend=ofi pmi=pmix ^fftw -mpi # should be doing this, can't yet
      - namd@3.0.1 ^charmpp backend=ucx pmi=pmix ^fftw -mpi
      #- namd@3.0.1 ^charmpp backend=verbs ^fftw -mpi # not working outside dev
      - netlib-scalapack@2.2.3
      - numactl@2.0.19
      - openblas@0.3.33 threads=none
      - openblas@0.3.33 threads=openmp
      - plumed@2.10.0
      - quantum-espresso@7.5 cflags='-O2' fflags='-O2' # ICE in gcc 12 and 13 vectorisation: https://gcc.gnu.org/bugzilla/show_bug.cgi?id=112404
      - lammps@20250722.3 +mpi +python +amoeba +asphere +bocs +body +bpm +brownian +cg-dna +cg-spica +class2 +colloid +colvars +compress +coreshell +dielectric +diffraction +dipole +dpd-basic +dpd-meso +dpd-react +dpd-smooth +drude +eff +electrode +extra-compute +extra-dump +extra-fix +extra-molecule +extra-pair +fep +granular +interlayer +kspace +lepton +machdyn +manybody +mc +meam +mesont +misc +ml-iap +ml-pod +ml-snap +ml-uf3 +mofff +molecule +openmp +opt +orient +peri +phonon +plugin +poems +qeq +reaction +reaxff +replica +rigid +rheo +shock +sph +spin +srd +tally +uef +voronoi +yaff
      - lammps@20240829.4 +mpi +python +amoeba +asphere +bocs +body +bpm +brownian +cg-dna +cg-spica +class2 +colloid +colvars +compress +coreshell +dielectric +diffraction +dipole +dpd-basic +dpd-meso +dpd-react +dpd-smooth +drude +eff +electrode +extra-compute +extra-dump +extra-fix +extra-molecule +extra-pair +fep +granular +interlayer +kspace +lepton +machdyn +manybody +mc +meam +mesont +misc +ml-iap +ml-pod +ml-snap +ml-uf3 +mofff +molecule +openmp +opt +orient +peri +phonon +plugin +poems +qeq +reaction +reaxff +replica +rigid +rheo +shock +sph +spin +srd +tally +uef +voronoi +yaff
    - - '%gcc@14.2.0'

  # Intel compilers built with gcc
  #- matrix:
  #  - - intel-oneapi-compilers@2024.2.1 # there is 2025.1.0
  #    - intel-oneapi-compilers@2023.2.4 # last icc/icpc version
  #  - - '%gcc@14.2.0'

  concretizer:
    unify: when_possible

  view: false

  include:
  - /lustre/apps/spack/1.2.2/deploy/2026-11/spack/var/spack/environments/second_compiler/spack.lock
