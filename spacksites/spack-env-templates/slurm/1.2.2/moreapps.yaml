spack:
  concretizer:
    unify: when_possible
  view: false

  packages:
    fftw-api:
      require: 'fftw'

    all:
      require:
      - 'target=x86_64_v4'

  specs:
  - matrix:
    - - glpk@5.0 +gmp
      - grace@5.1.25
      - openbabel@3.1.1 +openmp
      - openfoam@2512 +int64
      - openfoam@2312 +int64
      - openfoam@2112 +int64
      - orca@6.0.1
      - parallel@20240822
      - paraview@5.13.1 +python ^[virtuals=gl] osmesa ^llvm
      - vmd@2.0.0a8
    - - '%gcc@14.2.0'

  include_concrete:
  - /apps/spack/1.2.2/deploy/2026-09/spack/var/spack/environments/base

