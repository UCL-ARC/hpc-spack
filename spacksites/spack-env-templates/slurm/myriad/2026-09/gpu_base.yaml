spack:
  concretizer:
    unify: when_possible
  view: false

  packages:
    all:
      require:
      - 'target=x86_64_v4'

  specs:
  # CUDA packages, compile them with gcc@12
  - matrix:
    - - cuda@12.5.1 # for octopus, py-jaxlib, py-tensorflow and py-alphafold
      - cuda@12.9.1
      - cuda@13.3.0
      - nvhpc +mpi default_cuda=12.9
    - - '%gcc@14.2.0'

  include_concrete:
  - /apps/spack/1.2.2/deploy/2026-09/spack/var/spack/environments/base
