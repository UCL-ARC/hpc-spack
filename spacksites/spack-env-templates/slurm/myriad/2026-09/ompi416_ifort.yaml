spack:
  concretizer:
    unify: when_possible
  view: false

  packages:
    all:
      require:
      - 'target=x86_64_v4'

  # OpenMPI 4.1.6 with ifort for CRYSTAL (4.1.2 didn't build with icx but this does)
  specs:
  - matrix:
    - - openmpi@4.1.6 fabrics=ucx,cma schedulers=slurm +legacylaunchers
    - - '%intel@2021.13.1'

  include_concrete:
  - /apps/spack/1.2.2/deploy/2026-09/spack/var/spack/environments/intel
  - /apps/spack/1.2.2/deploy/2026-09/spack/var/spack/environments/intel_classic


