spack:
  packages:
    mpi:
      require: 'openmpi'
    openmpi:
      require: 'arch=linux-rhel9-x86_64_v3'
    all:
      require:
      - 'target=x86_64_v3'

  specs:
  # CUDA packages, compile them with gcc@12
  - matrix:
    - - plumed@2.9.2 +pytorch
      - gromacs@2024.3 +cuda cuda_arch=80 ^openmpi@4.1.6
      - gromacs@2023.5 +cuda cuda_arch=80 +plumed ^openmpi@4.1.6
      - gromacs@2023.5 +cuda cuda_arch=80 +plumed -mpi
      - openmpi@4.1.6 +cuda cuda_arch=80 fabrics=psm2,ofi schedulers=slurm +legacylaunchers
    - - '%gcc@12.3.0'
  # nvhpc packages
  - 'vasp@6.4.3 %nvhpc +cuda cuda_arch=80 +hdf5'

  concretizer:
    unify: when_possible
  view: false

  include_concrete:
  - /apps/spack/0.23/deploy/2026-04/spack/var/spack/environments/gpu_base
