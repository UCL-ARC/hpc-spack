spack:
  concretizer:
    unify: when_possible
  view: false

  packages:
    all:
      target: [x86_64_v3] # incs the Broadwell and AMD EPYC (zen3)

  specs:
  - matrix:
    - - fftw@3.3.10 -mpi -openmp
      # - julia ^llvm~clang~gold~polly ^openblas threads=openmp
      - openblas@0.3.28 +dynamic_dispatch threads=none
      - openblas@0.3.28 +dynamic_dispatch threads=openmp
      - openmpi@4.1.6 fabrics=psm2,ucx,ofi schedulers=slurm +legacylaunchers
      - python@3.11.6
    - - '%gcc@12.3.0'
  - gcc@12.3.0

  # Intel compilers built with gcc
  - matrix:
    - - intel-oneapi-compilers@2024.2.1 # there is 2025.1.0
    - - '%gcc@12.3.0'
