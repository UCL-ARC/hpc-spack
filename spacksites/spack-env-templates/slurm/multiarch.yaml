spack:
  concretizer:
    unify: when_possible
  view: false

  packages:
    all:
      require:
      - 'target=x86_64_v3' # incs the Broadwell and AMD EPYC (zen3)

  specs:
  # Packages built with GCC
  - matrix:
    - - fftw@3.3.10 -mpi -openmp
      # - julia ^llvm~clang~gold~polly ^openblas threads=openmp
      - openblas@0.3.28 +dynamic_dispatch threads=none
      - openblas@0.3.28 +dynamic_dispatch threads=openmp
      - openmpi@4.1.6 fabrics=psm2,ucx,ofi schedulers=slurm +legacylaunchers
      - python@3.11.6
    - - '%gcc@12.3.0'

  # Packages built with Intel compiler
  - matrix:
    - - intel-oneapi-mpi@2021.14.0 +external-libfabric
      - intel-oneapi-mkl@2023.2.0 +cluster mpi_family=mpich ^intel-oneapi-mpi
      - intel-oneapi-mkl@2023.2.0 +cluster mpi_family=openmpi ^openmpi%oneapi@2024.2.1
      - openmpi@4.1.6 fabrics=psm2,ucx,ofi schedulers=slurm +legacylaunchers
    - - '%oneapi@2024.2.1'

  # Intel compilers built with gcc
  - matrix:
    - - intel-oneapi-compilers@2024.2.1 # there is 2025.1.0
    - - '%gcc@12.3.0'
