spack:

  concretizer:
    unify: when_possible

  view: false

  include:
  - /lustre/apps/spack/1.2.2/deploy/2026-11/spack/var/spack/environments/base/spack.lock
  - /lustre/apps/spack/1.2.2/deploy/2026-11/spack/var/spack/environments/moreapps/spack.lock

  definitions:
    - compiler: ['%gcc@14.2.0']
    - package_specs_compiler:
      - openmpi@4.1.2 fabrics=psm2,ofi schedulers=slurm +legacylaunchers
      - orca@5.0.4

  specs:
    - matrix:
      - [$package_specs_compiler]
      - [$compiler]
