spack:

  concretizer:
    unify: when_possible

  view: false

  include:
  - /lustre/apps/spack/1.2.2/deploy/2026-11/spack/var/spack/environments/base/spack.lock
  - /lustre/apps/spack/1.2.2/deploy/2026-11/spack/var/spack/environments/moreapps/spack.lock

  definitions:
    - compiler: ['%gcc@14.2.0']
    - package_specs:
      - miniconda3@25.5.1
    - package_specs_compiler:
      - mamba@2.3.0
      - salome-medcoupling@9.15.0
      - gromacs@2026.1 -double

  specs:
    - $package_specs
    - matrix:
      - [$package_specs_compiler]
      - [$compiler]
