spack:

  concretizer:
    unify: when_possible

  view: false

  include:
  - /lustre/apps/spack/1.2.2/deploy/2026-11/spack/var/spack/environments/intel/spack.lock

  # OpenMPI 4.1.6 with ifort for CRYSTAL (4.1.2 didn't build with icx but this does)
  specs:
    - openmpi@4.1.6 fabrics=psm2,ofi schedulers=slurm +legacylaunchers %intel@2021.10.0
