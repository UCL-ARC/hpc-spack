      require: 'fftw'

    c:
      require: gcc@14.2.0
    cxx:
      require: gcc@14.2.0
    fortran:
      require: gcc@14.2.0

  specs:
  - cp2k@2025.2
  - glpk@5.0 +gmp
  - grace@5.1.25
  - openbabel@3.1.1 +openmp
  - openfoam@2312 +int64
  - openfoam@2112 +int64
