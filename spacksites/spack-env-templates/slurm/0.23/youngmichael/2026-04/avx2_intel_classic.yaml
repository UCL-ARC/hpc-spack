spack:

  packages:
    all:
      require:
      - 'target=x86_64_v3' # incs the Broadwell and AMD EPYC (zen3)

  specs:

  # make a compiler with ifort from the oneapi install. Compilers entry will need manual editing
  # as it expects an icc for an intel@=2021.13.1 compiler so will add this as another oneapi.
  - matrix:
    - - intel-oneapi-compilers-classic
    - - '%oneapi@2024.2.1'

  concretizer:
    unify: when_possible
  view: false

  include_concrete:
  - /apps/spack/0.23/deploy/2026-04/spack/var/spack/environments/avx2_buildtools

