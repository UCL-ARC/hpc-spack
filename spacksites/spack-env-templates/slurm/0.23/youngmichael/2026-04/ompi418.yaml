spack:
  packages:
    all:
      require:
      - 'target=x86_64_v3'

  specs:
  - matrix:
    - - openmpi@4.1.8 fabrics=psm2,ofi schedulers=slurm +legacylaunchers
      - orca@avx2-6.1.1
    - - '%gcc@12.3.0'

  concretizer:
    unify: when_possible
  view: false

  include_concrete:
  - /apps/spack/0.23/deploy/2026-04/spack/var/spack/environments/multiarch

