spack:
  concretizer:
    unify: when_possible
  view: false

  # OpenMPI 4.1.6 with ifort for CRYSTAL (4.1.2 didn't build with icx but this does)
  specs:
  - matrix:
    - - openmpi@4.1.6 fabrics=ucx,cma schedulers=slurm +legacylaunchers
    - - '%intel@2021.13.1'

  include_concrete:
  - /apps/spack/0.23/deploy/2026-05/spack/var/spack/environments/intel
  - /apps/spack/0.23/deploy/2026-05/spack/var/spack/environments/intel_classic


