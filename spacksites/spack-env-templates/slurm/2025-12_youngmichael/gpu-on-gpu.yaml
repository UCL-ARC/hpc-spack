spack:
  packages:
    all:
      require:
      - 'target=x86_64_v3'
  specs:
  # CUDA packages, compile them with gcc@12
  - matrix:
    # Fix `openblas` as blas provider, to avoid picking other unusual implementations
    - - 'dbcsr@2.6.0 +openmp +mpi +cuda cuda_arch=80 -examples ^openblas@0.3.28 threads=openmp ^openmpi@4.1.6 +cuda' # only one CUDA arch allowed
      #- 'py-alphafold@2.2.4 +cuda cuda_arch=80 ^py-scipy@1.11.4 ^py-pythran@0.12.2 ^openmm@7.5.1 +cuda cuda_arch=80 ^openblas ^llvm -gold'
    - - '%gcc@12.3.0'
  concretizer:
    unify: when_possible
  view: false
  include_concrete:
  - /lustre/apps/spack/0.23/deploy/2025-12/spack/var/spack/environments/avx2_buildtools
  - /lustre/apps/spack/0.23/deploy/2025-12/spack/var/spack/environments/multiarch
  - /lustre/apps/spack/0.23/deploy/2025-12/spack/var/spack/environments/gpu_first
