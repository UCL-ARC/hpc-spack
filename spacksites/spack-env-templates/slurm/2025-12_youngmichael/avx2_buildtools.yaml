spack:
  concretizer:
    unify: when_possible
  view: false

  packages:
    all:
      require:
      - 'target=x86_64_v3' # incs the Broadwell and AMD EPYC (zen3)

  specs:
  - matrix:
    - - apr
      - apr-util
      - autoconf
      - autoconf-archive
      - automake
      - cmake
      - curl
      - git@2.46.2
      # - gmake # don't have it yet
      - gzip@1.13
      - libtool
      - perl@5.38.0
      - subversion
      - texinfo
    - - '%gcc@12.3.0'
  - gcc@12.3.0 +binutils

  # Intel compilers built with gcc
  - matrix:
    - - intel-oneapi-compilers@2024.2.1 # there is 2025.1.0
  #   - intel-oneapi-compilers@2023.2.4 # last icc/icpc version
    - - '%gcc@12.3.0'

  include_concrete:
  - /lustre/apps/spack/0.23/deploy/2025-12/spack/var/spack/environments/second_compiler
