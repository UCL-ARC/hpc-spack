spack:
  concretizer:
    unify: when_possible
  view: false

  # the Young avx512 end CPU applications
  specs:

  # Packages built with Intel compiler
  - matrix:
    - - vasp@6.5.1 +hdf5 ^intel-oneapi-mpi
      - vasp@6.4.3 +hdf5 ^intel-oneapi-mpi
      - vasp@=5.4.4 +scalapack ^intel-oneapi-mpi
      - hdf5 +fortran +mpi +hl
    - - 'target=x86_64_v4 %oneapi@2024.2.1'

  include_concrete:
  - /lustre/apps/spack/0.23/deploy/2025-12/spack/var/spack/environments/multiarch_intel
