spack:
  packages:
    castep:
      permissions:
        read: group
        #group: lgcastep
        group: ag-archpc-castep
    orca:
      permissions:
        read: group
        #group: legorca
        group: ag-archpc-orca
    vasp@6:
      permissions:
        read: group
        #group: legvasp6
        group: ag-archpc-vasp6

  specs:
  - matrix:
    - - bcftools@1.16
      - beast2@2.7.4
      - bedtools2@2.31.0
      - bwa@0.7.17
      - fftw@3.3.10 -mpi -openmp
      - gatk@4.4.0.0
      - git@2.46.2
      - gsl@2.8
      - gzip@1.13
      - hdf5@1.14.3 +cxx +fortran -mpi +hl
      - hdf5@1.14.3 +fortran +mpi +hl
      - htslib@1.17
      - openmpi@4.1.6 fabrics=psm2,ucx,ofi schedulers=slurm +legacylaunchers
      - python@3.11.6
      - netcdf-c@4.9.2 -mpi
      - netcdf-fortran@4.6.1
      - picard@2.26.2
      - samtools@1.17
      # stop it picking an openblas with threads=openmp purely for package reuse
      - castep@24.1 +libxc ^openblas threads=none
      - castep@23.1 +libxc ^openblas threads=none
      - cp2k@2024.3 
      - gromacs@2024.3 -double
      #- gromacs@2024.3 +double
      - gromacs@2023.5 -double +plumed
      #- gromacs@2023.5 +double +plumed
      - lammps@20240829.1 +mpi +python +amoeba +asphere +bocs +body +bpm +brownian +cg-dna +cg-spica +class2 +colloid +colvars +compress +coreshell +dielectric +diffraction +dipole +dpd-basic +dpd-meso +dpd-react +dpd-smooth +drude +eff +electrode +extra-compute +extra-dump +extra-fix +extra-molecule +extra-pair +fep +granular +interlayer +kspace +lepton +machdyn +manybody +mc +meam +mesont +misc +ml-iap +ml-pod +ml-snap +ml-uf3 +mofff +molecule +openmp +opt +orient +peri +phonon +plugin +poems +qeq +reaction +reaxff +replica +rigid +rheo +shock +sph +spin +srd +tally +uef +voronoi +yaff
      - libxc@6.2.2
      - namd@2.14 ^charmpp backend=ucx pmi=pmix ^fftw -mpi
      #- namd@3.0.1 ^charmpp backend=ofi pmi=pmix ^fftw -mpi # should be doing this, can't yet
      - namd@3.0.1 ^charmpp backend=ucx pmi=pmix ^fftw -mpi
      - namd@3.0.1 ^charmpp backend=verbs ^fftw -mpi
      - netlib-scalapack@2.2.0
      - numactl@2.0.18
      - openblas@0.3.28 threads=none
      - openblas@0.3.28 threads=openmp
      - plumed@2.9.2
    - - '%gcc@12.3.0'
  - gcc@12.3.0

  # Intel compilers built with gcc
  - matrix:
    - - intel-oneapi-compilers@2024.2.1 # there is 2025.1.0
  #   - intel-oneapi-compilers@2023.2.4 # last icc/icpc version
    - - '%gcc@12.3.0'

  concretizer:
    unify: when_possible
  view: false

  modules:
    default:
      tcl:
        projections:
          # Named packages where we have more than one installed so need different module names.
          # First match is picked, so more specific need to be at top. 'all' can be anywhere.
          # Add omp for openmp variants.
          gcc: 'compilers/{name}/{version}/{compiler.name}-{compiler.version}'
          intel-oneapi-compilers: 'compilers/intel-oneapi/{version}/{compiler.name}-{compiler.version}'
          openmpi: 'mpi/{name}/{version}/{compiler.name}-{compiler.version}'

          fftw +openmp ^mpi: '{name}/{version}-{^mpi.name}-omp/{compiler.name}-{compiler.version}'
          fftw +openmp: '{name}/{version}-omp/{compiler.name}-{compiler.version}'
          openblas threads=openmp: '{name}/{version}-omp/{compiler.name}-{compiler.version}'

          gromacs +plumed ^mpi: '{name}/{version}-{^mpi.name}-plumed/{compiler.name}-{compiler.version}'
          namd ^mpi ^charmpp backend=ofi: '{name}/{version}-{^mpi.name}-ofi/{compiler.name}-{compiler.version}'
          namd ^mpi ^charmpp backend=ucx: '{name}/{version}-{^mpi.name}-ucx/{compiler.name}-{compiler.version}'
          namd ^mpi ^charmpp backend=verbs: '{name}/{version}-{^mpi.name}-verbs/{compiler.name}-{compiler.version}'
          namd ^charmpp backend=ofi: '{name}/{version}-ofi/{compiler.name}-{compiler.version}'
          namd ^charmpp backend=ucx: '{name}/{version}-ucx/{compiler.name}-{compiler.version}'
          namd ^charmpp backend=verbs: '{name}/{version}-verbs/{compiler.name}-{compiler.version}'

          ^cuda ^mpi: '{name}/{version}-{^mpi.name}-cuda/{compiler.name}-{compiler.version}'
          ^mpi: '{name}/{version}-{^mpi.name}/{compiler.name}-{compiler.version}'
          ^cuda: '{name}/{version}-cuda/{compiler.name}-{compiler.version}'
          all:  '{name}/{version}/{compiler.name}-{compiler.version}'

    prefix_inspections:
      lib: ["LD_LIBRARY_PATH", "LIBRARY_PATH"]
      lib64: ["LD_LIBRARY_PATH", "LIBRARY_PATH"]

