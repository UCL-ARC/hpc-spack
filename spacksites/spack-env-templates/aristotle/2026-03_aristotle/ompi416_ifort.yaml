spack:
  # OpenMPI 4.1.6 with ifort for CRYSTAL (4.1.2 didn't build with icx but this does)
  specs:
  - matrix:
    - - openmpi@4.1.6 fabrics=tcp schedulers=none +legacylaunchers
    - - '%intel@2021.13.1'

  concretizer:
    unify: when_possible
  view: false
  include_concrete:
  - /lustre/apps/spack/0.23/deploy/2026-03/spack/var/spack/environments/intel
  - /lustre/apps/spack/0.23/deploy/2026-03/spack/var/spack/environments/intel_classic

  modules:
    default:

      roots:
        tcl: $env/modules

