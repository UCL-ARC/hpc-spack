toolchains:
  gcc_ompi:
  - spec: "%c=gcc"
    when: "%c"
  - spec: "%cxx=gcc"
    when: "%cxx"
  - spec: "%fortran=gcc"
    when: "%fortran"
  - spec: %mpi=openmpi@4 fabrics=psm2,ofi schedulers=slurm +legacylaunchers
    when: %mpi

# gcc_ompi_cuda

  intel_ifx_impi:
  - spec: %c=intel-oneapi-compilers @2024.2.1
    when: %c
  - spec: %cxx=intel-oneapi-compilers @2024.2.1
    when: %cxx
  - spec: %fortran=intel-oneapi-compilers @2024.2.1
    when: %fortran
  - spec: %mpi=intel-oneapi-mpi @2021.14.0 +external-libfabric
    when: %mpi
