#    when: %scalapack

  intel_ifx_ompi:
  - spec: %c=intel-oneapi-compilers @2024.2.1
    when: %c
  - spec: %cxx=intel-oneapi-compilers @2024.2.1
    when: %cxx 
  - spec: %fortran=intel-oneapi-compilers @2024.2.1
    when: %fortran
  - spec: %mpi=openmpi@4.1.6 fabrics=psm2,ofi schedulers=slurm +legacylaunchers
    when: %mpi
# intel-oneapi-mkl@2023.2.0 +cluster mpi_family=openmpi ^openmpi%oneapi@2024.2.1
#  - spec: %blas=intel-oneapi-mkl @2023.2.0 +cluster mpi_family=openmpi ^openmpi%oneapi@2024.2.1
#    when: %blas
