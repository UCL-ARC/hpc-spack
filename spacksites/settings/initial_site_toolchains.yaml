  intel_icx_ifort:
  - spec: %c=intel-oneapi-compilers @2024.2.1
    when: %c
  - spec: %cxx=intel-oneapi-compilers @2024.2.1
    when: %cxx
  - spec: %fortran=intel-compilers-classic @2021.13.1
    when: %fortran
# may not be able to specify this here since built with mixed chain itself
