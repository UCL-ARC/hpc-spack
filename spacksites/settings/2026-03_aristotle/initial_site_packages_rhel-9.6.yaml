packages:

  # New Aristotle machines are VMs so configured for TCP-only OpenMPI & no slurm/pmix/fabric integration
  hwloc:
    externals:
    - spec: hwloc@2.4.1
      prefix: /usr
    buildable: false

  libfabric:
    externals:
    - spec: libfabric@1.22.0 fabrics=psm2,opx,shm,sockets,tcp,udp
      prefix: /usr
    buildable: false

  ucx:
    externals:
    - spec: ucx@1.17.0
      prefix: /usr
    buildable: false

  # openssh is also external - a Spack-built openssh will ignore
  # our global ssh config.
  openssh:
    externals:
    - spec: openssh@8.7p1 +gssapi
      prefix: /usr
    buildable: false

  # zlib bits
  zlib-api:
    require: 'zlib-ng'

  zlib-ng:
    require:
    - spec: +new_strategies

  openmpi:
    require:
    - spec: 'fabrics=tcp schedulers=none +legacylaunchers'
    prefer:
    - '@4.1.6'

  # group restrictions
  castep:
    permissions:
      read: group
      group: ag-archpc-castep
  orca:
    permissions:
      read: group
      group: ag-archpc-orca
  # restrict vasp to highest version and alter after since there can be only one
  vasp:
    permissions:
      read: group
      group: ag-archpc-vasp65


  all:
    compiler: [gcc@12.3.0]

